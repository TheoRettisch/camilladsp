on: [push, pull_request]

name: CI test and lint

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check_lint_test_linux_amd64:
    name: Check test and lint Linux
    runs-on: ubuntu-latest
    #container: ubuntu:20.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Update package list
        run: sudo apt-get update

      - name: Install utils
        run: sudo apt-get install curl wget -y

      - name: Install Rust 1.97.1 toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Install Alsa devel
        run: sudo apt-get install libasound2-dev -y

      - name: Install PipeWire development files
        run: sudo apt-get install libpipewire-0.3-dev -y

      - name: Install PulseAudio
        run: DEBIAN_FRONTEND="noninteractive" sudo apt-get install libpulse0 libpulse-dev -y

      - name: Install Jack
        run: DEBIAN_FRONTEND="noninteractive" sudo apt-get install libjack-dev -y

      - name: Install OpenSSL
        run: sudo apt-get install openssl libssl-dev -y

      - name: Run cargo check
        run: cargo check

      - name: Run cargo check nodefault
        run: cargo check --no-default-features

      - name: Run cargo test with all supported backends
        run: cargo test --features bluez-backend,cpal-backend,jack-backend,pulse-backend,pipewire-backend

      - name: Run cargo test with all optional features
        run: cargo test --features debug,secure-websocket

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

  check_test_aarch64:
    name: Check and test Linux arm 64bit
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Update package list
        run: sudo apt-get update

      - name: Install utils
        run: sudo apt-get install curl wget -y

      - name: Install Rust 1.97.1 toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Install Alsa devel
        run: sudo apt-get install libasound2-dev -y

      - name: Run cargo check
        run: cargo check

      - name: Run cargo test
        run: cargo test

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings
